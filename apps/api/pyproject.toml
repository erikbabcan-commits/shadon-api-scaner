[project]
name = "straz-api"
version = "0.1.0"
description = "Straz monitoring API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.2.0",
  "httpx>=0.28.0",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "python-multipart>=0.0.17",
  "dnspython>=2.7.0",
  "email-validator>=2.2.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
