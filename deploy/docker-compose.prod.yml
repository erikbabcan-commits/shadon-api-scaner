# Production overlay — use with (from deploy/):
#   docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Compose interpolates ${STRAZ_DOMAIN} from --env-file (not from env_file: on services).
# When frontend is on Vercel:
#   STRAZ_CORS_ORIGINS=https://straz.vercel.app,https://your-custom-domain.com
#   STRAZ_COOKIE_SAMESITE=none
#   STRAZ_COOKIE_SECURE=true

services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    restart: unless-stopped
    environment:
      STRAZ_ENV: "production"
      STRAZ_COOKIE_SECURE: "true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    restart: unless-stopped
    environment:
      STRAZ_ENV: "production"
      STRAZ_COOKIE_SECURE: "true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.https:/etc/caddy/Caddyfile:ro
      - web_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      STRAZ_DOMAIN: ${STRAZ_DOMAIN:?set STRAZ_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
