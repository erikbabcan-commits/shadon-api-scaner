name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret gate (tree and introduced commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify rejection and redaction with synthetic fixtures
        run: python3 scripts/test_secret_gate.py
      - name: Reject tracked credentials and secrets in the current tree
        run: python3 scripts/check_secrets.py tree
      - name: Reject secrets introduced by this PR or push
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_secrets.py range --base "$SCAN_BASE" --head "$SCAN_HEAD"

  backend-tests:
    needs: secret-scan
    name: Backend Pytest & Migrations (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_USER: straz
          POSTGRES_PASSWORD: straz_test_password
          POSTGRES_DB: straz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./apps/api
        run: |
          uv sync --frozen --dev

      - name: Run Pytest test suite
        working-directory: ./apps/api
        env:
          QUOTA_REDIS_URL: redis://127.0.0.1:6379/14
          STRAZ_TEST_PG_URL: postgresql+asyncpg://straz:straz_test_password@127.0.0.1:5432/straz_test
          STRAZ_ENV: testing
          DATABASE_URL: postgresql+asyncpg://straz:straz_test_password@localhost:5432/straz_test
          REDIS_URL: redis://localhost:6379/0
          STRAZ_SESSION_SECRET: test-session-secret-for-ci-runs-1234567890
          STRAZ_ADMIN_PASSWORD: test-admin-password-for-ci
        run: |
          uv run --frozen pytest -v

  frontend-build:
    needs: secret-scan
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./apps/web
        run: |
          npm ci --ignore-scripts

      - name: Build and test frontend application
        working-directory: ./apps/web
        env:
          VITE_API_URL: https://api.straz.example.com
        run: |
          npm test
          npm run build
          npx --no-install tsc --noEmit

      - name: Verify build artifacts
        working-directory: ./apps/web
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          echo "Frontend built successfully!"
