name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: straz
          POSTGRES_PASSWORD: straz_test_password
          POSTGRES_DB: straz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./apps/api
        run: |
          uv sync --dev

      - name: Run Pytest test suite
        working-directory: ./apps/api
        env:
          STRAZ_ENV: testing
          DATABASE_URL: postgresql+asyncpg://straz:straz_test_password@localhost:5432/straz_test
          REDIS_URL: redis://localhost:6379/0
          STRAZ_SESSION_SECRET: test-session-secret-for-ci-runs-1234567890
          STRAZ_ADMIN_PASSWORD: test-admin-password-for-ci
        run: |
          uv run pytest -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./apps/web
        run: |
          npm ci

      - name: Build frontend application
        working-directory: ./apps/web
        env:
          VITE_API_URL: https://api.straz.example.com
        run: |
          npm run build

      - name: Verify build artifacts
        working-directory: ./apps/web
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          echo "Frontend built successfully!"
